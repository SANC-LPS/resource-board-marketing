<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank you — Resource Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- REMOVE noindex before public launch -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:       #0e2241;
    --navy-deep:  #081729;
    --navy-mid:   #1a3a5c;
    --amber:      #d97706;
    --amber-hover:#f59e0b;
    --amber-dark: #b45309;
    --paper:      #f8fafc;
    --steel:      #64748b;
    --steel-light:#a9bcd6;
    --line:       rgba(255,255,255,0.09);
    --line-dark:  #e2e8f0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--navy);
    color:#fff;
    font-family:'Barlow',sans-serif;
    font-weight:400;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  a{color:inherit;text-decoration:none;}

  .thanks{max-width:520px;text-align:center;}
  .thanks-mark{width:40px;height:40px;margin:0 auto 22px;display:block;}
  .thanks h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;
    font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:0.02em;color:#fff;
  }
  .thanks-rule{width:60px;height:3px;background:var(--amber);border:0;margin:18px auto 20px;}
  .thanks p{font-family:'Barlow',sans-serif;font-weight:400;font-size:16px;line-height:1.6;color:var(--steel-light);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;padding:11px 22px;
    font-family:'Barlow',sans-serif;font-weight:600;font-size:14px;
    letter-spacing:0.02em;
    border:1px solid transparent;border-radius:4px;
    cursor:pointer;transition:border-color 120ms ease;
    text-decoration:none;
  }
  .btn:focus-visible{outline:2px solid var(--amber-hover);outline-offset:2px;}
  .btn-ghost-light{background:transparent;border-color:rgba(255,255,255,0.2);color:#fff;}
  .btn-ghost-light:hover{border-color:rgba(255,255,255,0.5);}
  .thanks .btn{margin-top:28px;}
</style>
</head>
<body>
  <main class="thanks">
    <svg class="thanks-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0" y="0" width="32" height="32" rx="4" ry="4" fill="#1a3a5c"/>
      <rect x="6" y="14.5" width="20" height="3" fill="#ffffff"/>
      <rect x="14.5" y="6" width="3" height="20" fill="#ffffff"/>
      <circle cx="23" cy="9" r="3.5" fill="#d97706"/>
    </svg>
    <h1>Request received.</h1>
    <hr class="thanks-rule">
    <p>Thanks for reaching out. We'll be in touch soon to set up a walkthrough on your own project data.</p>
    <a href="/" class="btn btn-ghost-light">Back to resourceboard.io</a>
  </main>
</body>
</html>
